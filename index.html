<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Secret Chat</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="container">


    <!-- تسجيل الدخول -->

    <div id="loginBox" class="box">


        <h2>🔒 قصائد الملا باسم الكربلائي 2006</h2>


        <input 
        id="username"
        type="text"
        placeholder="اكتب اسمك">


        <input 
        id="password"
        type="password"
        placeholder="كلمة المرور">


        <button id="loginBtn">
            دخول
        </button>


        <p id="errorMessage"></p>


    </div>





    <!-- المحادثة -->


    <div id="chatBox" class="box hidden">


        <div id="messages"></div>



        <div class="send-box">


           <textarea 
id="messageInput"
placeholder="اكتب رسالة..."
rows="1"></textarea>


<button id="sendBtn" class="send-icon">
    ➤
</button>

        </div>


    </div>



</div>



<script type="module" src="script.js"></script>


</body>

</html>
